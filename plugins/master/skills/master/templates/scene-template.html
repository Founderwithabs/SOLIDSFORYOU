<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Motion-graphics scene template.
  - Everything on screen is driven by renderFrame(t): the same t always draws
    the same frame, so the renderer can capture it frame by frame.
  - Do not use CSS transitions, CSS animations, setTimeout or video elements
    for motion; they run on real time and will not render correctly.
  - Opened normally in a browser, the page plays in real time as a preview.
  - Fonts: use local or system fonts, or embed them as data URLs. Remote
    fonts can fail to load during rendering.
-->
<style>
  :root {
    --bg: #05070f;
    --glow: #1d3bff;
    --card: rgba(18, 24, 48, 0.86);
    --line: rgba(120, 150, 255, 0.28);
    --text: #f2f4ff;
    --muted: #8d97c4;
    --accent: #4d7cff;
    --alert: #ff4d5e;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--text); }
  #stage { position: absolute; inset: 0; }
  #glow {
    position: absolute; left: 50%; top: 50%; width: 1400px; height: 1400px;
    margin: -700px 0 0 -700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(29,59,255,0.35) 0%, rgba(29,59,255,0) 60%);
  }
  /* Light noise on top of gradients prevents banding after compression. */
  #grain {
    position: absolute; inset: 0; opacity: 0.05; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }
  .label { position: absolute; font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
  .title { position: absolute; font-size: 96px; font-weight: 800; letter-spacing: -0.02em; }
  .card {
    position: absolute; padding: 36px 44px; border-radius: 28px;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    font-size: 48px; font-weight: 700;
  }
  .chip { display: inline-block; margin-right: 16px; padding: 10px 22px; border-radius: 999px;
    background: rgba(77,124,255,0.18); color: var(--accent); font-size: 30px; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div class="label" id="label" style="left:160px; top:200px">Lesson 01</div>
  <div class="title" id="title" style="left:160px; top:250px">Your left ≠ their left</div>
  <div class="card" id="card" style="left:160px; top:520px">
    <span class="chip" id="chip1">FACING YOU</span><span class="chip" id="chip2">ULTA</span>
  </div>
  <div id="grain"></div>
</div>
<script>
const DURATION = 6;          // seconds
const FPS = 30;

// ---- Easing (entrances ease out, exits ease in) -------------------------
const ease = {
  linear: (x) => x,
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outBack: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};

// Value of a tween at time t: holds `from` before start and `to` after end.
function tween(t, start, dur, from, to, e = ease.outCubic) {
  if (t <= start) return from;
  if (t >= start + dur) return to;
  return from + (to - from) * e((t - start) / dur);
}
const frames = (n) => n / FPS;   // durations in frames read better: frames(12)

// Entrance: slide up from `dy` px and fade in, starting at `start` seconds.
function enter(el, t, start, { dur = frames(12), dy = 40, e = ease.outCubic } = {}) {
  const y = tween(t, start, dur, dy, 0, e);
  el.style.opacity = tween(t, start, dur * 0.6, 0, 1, ease.linear);
  el.style.transform = `translateY(${y}px)`;
}

// ---- Cue sheet: put voiceover cue times here, in seconds -----------------
const CUE = {
  label: 0.10,
  title: 0.25,
  card: 1.20,
  chip2: 2.00,
};

const $ = (id) => document.getElementById(id);

function renderFrame(t) {
  const glowScale = 1 + 0.04 * Math.sin(t * 1.2);
  $("glow").style.transform = `scale(${glowScale})`;

  enter($("label"), t, CUE.label, { dur: frames(10), dy: 20 });
  enter($("title"), t, CUE.title, { dur: frames(14), dy: 50 });
  enter($("card"), t, CUE.card, { dur: frames(14), dy: 60 });
  enter($("chip1"), t, CUE.card + frames(4), { dur: frames(10), dy: 20 });
  const pop = tween(t, CUE.chip2, frames(10), 0.6, 1, ease.outBack);
  $("chip2").style.opacity = tween(t, CUE.chip2, frames(4), 0, 1, ease.linear);
  $("chip2").style.transform = `scale(${pop})`;
}

window.renderFrame = renderFrame;
window.DURATION = DURATION;

// Real-time preview when opened in a normal browser (not during rendering).
if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() {
    renderFrame(((performance.now() - t0) / 1000) % DURATION);
    requestAnimationFrame(loop);
  })();
} else {
  renderFrame(0);
}
</script>
</body>
</html>
